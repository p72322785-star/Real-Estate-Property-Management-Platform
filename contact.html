
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - EstateHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2>EstateHub</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="../member2/properties.html">Properties</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="../member4/login.html" class="login-btn">Login</a>
            </div>
        </nav>
    </header>

    <section class="contact">
        <h1>Contact Us</h1>
        <p>Have questions about a property? Get in touch with us.</p>

        <div class="contact-container">
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p><strong>Email:</strong> estatehub@example.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Address:</strong> Mathura, Uttar Pradesh, India</p>
            </div>

            <div class="contact-form">
                <h2>Send Us a Message</h2>

                <form>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>

                    <label for="email">Your Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject" required>

                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message" required></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 EstateHub. All rights reserved.</p>
    </footer>

</body>
</html>
